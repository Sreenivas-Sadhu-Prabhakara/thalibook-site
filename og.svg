<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-label="ThaliBook — the market list writes itself. A KARYA studio build.">
  <title>ThaliBook — the market list writes itself</title>

  <!-- warm paper base -->
  <rect width="1200" height="630" fill="#FBF6EF"/>

  <!-- faint order-book rules -->
  <g stroke="#EEE1D3" stroke-width="2">
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="230" x2="1200" y2="230"/>
    <line x1="0" y1="310" x2="1200" y2="310"/>
    <line x1="0" y1="390" x2="1200" y2="390"/>
    <line x1="0" y1="470" x2="1200" y2="470"/>
  </g>

  <!-- saffron accent band down the left, like an order-book margin -->
  <rect x="0" y="0" width="18" height="630" fill="#ea580c"/>
  <rect x="90" y="0" width="2" height="630" fill="#FCE7D5"/>

  <!-- thali logo mark -->
  <g transform="translate(130,108)">
    <circle cx="0" cy="0" r="34" fill="#ea580c"/>
    <circle cx="0" cy="0" r="34" fill="none" stroke="#9a3412" stroke-width="3"/>
    <circle cx="0" cy="0" r="11" fill="#FBF6EF"/>
    <circle cx="0" cy="-20" r="5.5" fill="#FBF6EF"/>
    <circle cx="19" cy="-6" r="5.5" fill="#FBF6EF"/>
    <circle cx="12" cy="16" r="5.5" fill="#FBF6EF"/>
    <circle cx="-12" cy="16" r="5.5" fill="#FBF6EF"/>
    <circle cx="-19" cy="-6" r="5.5" fill="#FBF6EF"/>
  </g>

  <!-- brand name -->
  <text x="188" y="127" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="46" font-weight="800" letter-spacing="-1">
    <tspan fill="#26140A">Thali</tspan><tspan fill="#ea580c">Book</tspan>
  </text>

  <!-- headline -->
  <text x="96" y="300" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#26140A">The market list</text>
  <text x="96" y="404" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="90" font-weight="800" letter-spacing="-3" fill="#ea580c">writes itself.</text>

  <!-- tagline -->
  <text x="98" y="478" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="31" font-weight="500" fill="#5C4A3E">Per-plate quotes, advances &amp; auto ingredient lists for caterers.</text>

  <!-- footer row: KARYA wordmark + subscription note -->
  <g transform="translate(96,556)">
    <rect x="0" y="-26" width="150" height="42" rx="21" fill="#ea580c"/>
    <text x="75" y="2" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="800" letter-spacing="3" fill="#FBF6EF">KARYA</text>
    <text x="172" y="1" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="22" font-weight="600" fill="#5C4A3E">studio build · subscription · pricing on discovery</text>
  </g>

  <!-- mini booking chip, top-right, echoing the product -->
  <g transform="translate(792,96)">
    <rect x="0" y="0" width="312" height="220" rx="16" fill="#FFFFFF" stroke="#E4CFB9" stroke-width="2"/>
    <text x="24" y="42" font-family="-apple-system, BlinkMacSystemFont, sans-serif" font-size="18" font-weight="700" fill="#26140A">Sharma · Wedding</text>
    <rect x="230" y="24" width="62" height="26" rx="13" fill="#ea580c"/>
    <text x="261" y="42" text-anchor="middle" font-family="-apple-system, sans-serif" font-size="13" font-weight="700" fill="#FBF6EF">Booked</text>

    <text x="24" y="80" font-family="'SF Mono', Menlo, monospace" font-size="15" fill="#5C4A3E">250 × Rs 420 = </text>
    <text x="288" y="80" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="16" font-weight="700" fill="#9a3412">Rs 1,05,000</text>

    <line x1="24" y1="98" x2="288" y2="98" stroke="#EEE1D3" stroke-width="2"/>

    <text x="24" y="128" font-family="-apple-system, sans-serif" font-size="16" fill="#5C4A3E">Onion</text>
    <text x="288" y="128" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#26140A">18.5 kg</text>
    <text x="24" y="156" font-family="-apple-system, sans-serif" font-size="16" fill="#5C4A3E">Paneer</text>
    <text x="288" y="156" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#26140A">9.0 kg</text>
    <text x="24" y="184" font-family="-apple-system, sans-serif" font-size="16" fill="#5C4A3E">Basmati rice</text>
    <text x="288" y="184" text-anchor="end" font-family="'SF Mono', Menlo, monospace" font-size="15" font-weight="700" fill="#26140A">21.0 kg</text>

    <rect x="24" y="196" width="150" height="8" rx="4" fill="#FCE7D5"/>
    <rect x="24" y="196" width="150" height="8" rx="4" fill="#ea580c" opacity="0.55"/>
  </g>
</svg>
